# KalaCUBE — full local/prod-parity stack.
#   docker compose up --build
# Frontend  -> http://localhost:3000
# Backend   -> http://localhost:8000
# Copy .env.docker.example to .env.docker and fill in secrets first.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      # Host port configurable (MONGO_PORT in ./.env) to avoid clashing with a
      # native mongod on 27017. Backend still uses the internal `mongo:27017`.
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Override host-facing values so the container talks to sibling services.
      NODE_ENV: production
      PORT: "8000"
      MONGO_URI: mongodb://mongo:27017/kalacube
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time; must be the URL the
        # BROWSER uses to reach the API (host machine), not the compose network.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Cognito public identifiers (no secret) — needed for login in-browser.
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-south-1_6Tz4OLn4d
        NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: 6n3t3poh0co772eaahgvopcfn
        NEXT_PUBLIC_COGNITO_DOMAIN: kalacube.auth.ap-south-1.amazoncognito.com
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      # Host port configurable (FRONTEND_PORT in ./.env) — defaults to 3000.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
